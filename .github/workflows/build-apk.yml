name: Build Android APK

# Запускается автоматически при каждом пуше в main, а ещё можно нажать
# "Run workflow" вручную на вкладке Actions в репозитории
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses (на всякий случай)
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install npm-зависимости
        run: npm install

      - name: Добавить платформу Android (Capacitor)
        run: npx cap add android

      - name: Подключить google-services.json (для push-уведомлений)
        run: |
          # Свежий Capacitor-проект (npx cap add android) уже сам содержит
          # весь нужный код для подключения плагина Google Services — он
          # проверяет наличие android/app/google-services.json и сам
          # применяет плагин, если файл на месте. Поэтому здесь достаточно
          # просто положить файл куда нужно — руками ничего в build.gradle
          # дописывать не нужно (это раньше приводило к дублированию
          # classpath/apply plugin и ломало сборку).
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json скопирован в android/app/ — Capacitor сам подключит плагин Google Services"
          else
            echo "google-services.json не найден в корне репозитория — сборка продолжится, но push-уведомления работать не будут, пока файл не добавлен"
          fi
          echo "=== проверка сразу после копирования ==="
          ls -la android/app/google-services.json || echo "ФАЙЛА НЕТ на этом этапе"

      - name: Показать конец android/app/build.gradle (проверка блока google-services)
        run: |
          echo "=== последние 20 строк android/app/build.gradle ==="
          tail -n 20 android/app/build.gradle

      - name: Добавить разрешения (камера/микрофон/уведомления) в AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          )
          content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          print(content)
          EOF

      - name: Сгенерировать иконку приложения из assets/icon.png
        run: npx capacitor-assets generate --android

      - name: Синхронизировать веб-код с Android-проектом
        run: npx cap sync android

      - name: Проверка перед сборкой (файл всё ещё на месте?)
        run: |
          echo "=== проверка перед сборкой ==="
          ls -la android/app/google-services.json || echo "ФАЙЛА НЕТ перед сборкой — вот причина проблемы"
          echo "=== последние 20 строк android/app/build.gradle перед сборкой ==="
          tail -n 20 android/app/build.gradle

      - name: Собрать debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build.log | tail -n 100
          echo "=== всё, что связано с google-services (с контекстом после каждой строки) ==="
          grep -n -iE "google-?services|firebaseapp|processdebuggoogleservices" /tmp/build.log -A 25 || echo "ничего не найдено в логе сборки"

      - name: Проверить, что google-services реально подключился
        run: |
          FILE="android/app/build/generated/res/google-services/debug/values/values.xml"
          if [ -f "$FILE" ]; then
            echo "OK: google-services сгенерировал файл ресурсов, Firebase должен инициализироваться"
            cat "$FILE"
          else
            echo "ПРОБЛЕМА: файл $FILE не найден по ожидаемому пути — ищем его где угодно внутри android/app/build:"
            find android/app/build -iname "*google-services*" -o -iname "values.xml" 2>/dev/null | grep -i google || echo "совсем ничего похожего не найдено"
            echo "--- и на всякий случай весь google_app_id по всем values.xml ---"
            grep -rl "google_app_id" android/app/build 2>/dev/null || echo "нигде не найдено google_app_id"
          fi

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: SLchat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
